name: Keep Streamlit Awake

on:
  schedule:
    # A cada 6 horas, em UTC (o GitHub pode atrasar alguns minutos em horarios de pico)
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping app
        run: |
          # Usa /healthz: a raiz do app responde 303 e joga num loop de login,
          # o que estoura o limite de redirects do curl (exit 47).
          curl -sS --fail \
            --retry 3 --retry-delay 10 --retry-all-errors \
            --max-time 60 \
            -o /dev/null -w "HTTP %{http_code} em %{time_total}s\n" \
            https://confirme-cha.streamlit.app/healthz
