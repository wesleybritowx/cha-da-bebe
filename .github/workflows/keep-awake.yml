name: Keep Streamlit Awake

on:
  schedule:
    # A cada 6 horas, em UTC (o GitHub pode atrasar alguns minutos em horarios de pico)
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instala dependencias
        run: pip install requests

      - name: Ping app
        run: python .github/scripts/ping_app.py
