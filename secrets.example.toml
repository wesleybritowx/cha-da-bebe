# MODELO de secrets — NÃO coloque dados reais aqui.
#
# Uso LOCAL:  copie este arquivo para  .streamlit/secrets.toml  e preencha.
# Uso na NUVEM (Streamlit Community Cloud): cole este mesmo conteúdo, já
#   preenchido, no campo "Secrets" das configurações do app.
#
# Onde encontrar cada valor: veja o README.md.

[gcp_service_account]
type = "service_account"
project_id = "seu-projeto-id"
private_key_id = "xxxxxxxxxxxxxxxxxxxx"
# Cole a chave privada inteira. Mantenha os \n como estão (uma linha só).
private_key = "-----BEGIN PRIVATE KEY-----\nMIIE...SUA_CHAVE...==\n-----END PRIVATE KEY-----\n"
client_email = "conta-servico@seu-projeto.iam.gserviceaccount.com"
client_id = "000000000000000000000"
auth_uri = "https://accounts.google.com/o/oauth2/auth"
token_uri = "https://oauth2.googleapis.com/token"
auth_provider_x509_cert_url = "https://www.googleapis.com/oauth2/v1/certs"
client_x509_cert_url = "https://www.googleapis.com/robot/v1/metadata/x509/conta-servico%40seu-projeto.iam.gserviceaccount.com"

[app]
# ID da planilha (o trecho entre /d/ e /edit na URL do Google Sheets)
sheet_id = "s6fd45g6df4b59dfb8db48dfbdb"
# Senha para acessar o painel do organizador (escolha uma)
organizador_senha = "troque-esta-senha"
